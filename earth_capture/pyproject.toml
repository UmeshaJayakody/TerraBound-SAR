[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terrabound-earth"
version = "0.1.0"
description = "Earth Capture: real-world 3D scenes from open data, turned into HR/LR SAR image pairs with the TerraBound SAR (RaySAR) pipeline"
license = "MIT"
authors = [{ name = "Umesha Jayakody" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "mapbox_earcut>=1.0",
  "requests>=2.31",
  "pillow>=10",
  "pywebview>=5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
earth-capture = "terrabound_earth.cli:main"

[tool.setuptools.packages.find]
include = ["terrabound_earth*"]

[tool.setuptools.package-data]
terrabound_earth = ["web/*", "web/vendor/leaflet/*", "web/vendor/leaflet/images/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio.*"]
